[platformio]
default_envs = xiao_esp32s3

[env:xiao_esp32s3]
platform = espressif32@6.10.0
board = seeed_xiao_esp32s3
framework = arduino
build_unflags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
build_flags =
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
lib_deps =
    t-vk/ESP32 BLE Keyboard@0.3.2
test_ignore = test_debounce

[env:xiao_esp32s3_ble_debug]
extends = env:xiao_esp32s3
build_flags =
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DPTT_BLE_DEBUG=1
monitor_speed = 115200

[env:native]
platform = native@1.2.1
platform_packages = platformio/toolchain-gccmingw32@1.50100.0
test_framework = unity
test_build_src = no
test_filter = test_debounce
build_flags = -std=c++11